<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택 화면</title>
    <!-- 둥근 글씨체를 사용하기 위한 구글 폰트 불러오기 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* 웹페이지 기본 스타일 설정 */
        body {
            margin: 0;
            padding: 0;
            /* 아이보리 색상 배경 */
            background-color: #FAF6EE; 
            /* 화면 정중앙 정렬을 위한 Flexbox 설정 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* 둥근 글씨체 우선 적용 */
            font-family: 'M PLUS Rounded 1c', 'Pretendard', sans-serif;
            position: relative;
            overflow: hidden; /* 장식용 이미지가 화면 밖으로 나갈 때 스크롤바 방지 */
        }

        /* 메인 콘텐츠 영역 (글씨와 버튼이 이미지 위에 오도록 설정) */
        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 중앙 안내 문구 스타일 */
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            /* 흰색 글씨 */
            color: #FFFFFF; 
            margin-bottom: 40px;
            /* 흰색 글씨가 아이보리 배경에서 잘 보이도록 부드러운 그림자 추가 */
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15); 
            letter-spacing: -1px;
        }

        /* 버튼들을 나란히 배치하기 위한 컨테이너 */
        .button-container {
            display: flex;
            gap: 20px; /* 버튼 사이의 간격 */
        }

        /* 공통 버튼 스타일 */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            /* 연두색 배경 */
            background-color: #A3E635; 
            /* 흰색 글씨 */
            color: #FFFFFF; 
            text-decoration: none;
            border-radius: 30px; /* 둥근 버튼 모양 */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        /* 버튼 위에 마우스를 올렸을 때(Hover) 효과 */
        .btn:hover {
            background-color: #8BDE1E; /* 조금 더 진한 연두색으로 변동 */
            transform: translateY(-2px); /* 살짝 위로 떠오르는 효과 */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        /* 버튼을 클릭했을 때 효과 */
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
        }

        /* [추가] 일러스트 이미지 데코레이션 공통 스타일 */
        .decor-img {
            position: absolute;
            pointer-events: none; /* 이미지가 버튼 클릭을 방해하지 않도록 설정 */
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            object-fit: cover;
        }

        /* 왼쪽 하단: 침대와 이불, 베개 느낌의 아늑한 침구 이미지 */
        .img-bedding {
            left: -50px;
            bottom: -50px;
            width: 450px;
            height: 450px;
            transform: rotate(15px);
            opacity: 0.85;
        }

        /* 오른쪽 하단: 귀여운 인형(곰인형) 이미지 */
        .img-doll {
            right: 40px;
            bottom: 40px;
            width: 300px;
            height: 300px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- [추가] 배경에 배치할 인형 및 침구류 이미지 (Unsplash의 고품질 무료 일러스트/사진 사용) -->
    <!-- 이불과 베개가 있는 침구 이미지 -->
    <img src="https://unsplash.com" alt="침구류와 베개" class="decor-img img-bedding">
    
    <!-- 귀여운 곰인형 이미지 -->
    <img src="https://unsplash.com" alt="인형" class="decor-img img-doll">

    <!-- 메인 콘텐츠 영역 -->
    <div class="main-content">
        <!-- 중앙 타이틀 문구 -->
        <div class="title">하나를 고르세요.</div>

        <!-- 나란히 배치된 버튼 2개 -->
        <div class="button-container">
            <a href="main.html" class="btn">자러가기</a>
            <a href="earthquake.html" class="btn">지진모델링</a>
        </div>
    </div>

</body>
</html>
