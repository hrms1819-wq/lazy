<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택 화면</title>
    <!-- 둥근 글씨체를 사용하기 위한 구글 폰트 불러오기 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* 웹페이지 기본 스타일 설정 */
        body {
            margin: 0;
            padding: 0;
            /* 연핑크(#FFE5EC)에서 아이보리(#FAF6EE)로 변하는 대각선 그라데이션 */
            background: linear-gradient(135deg, #FFE5EC 0%, #FAF6EE 100%); 
            /* 화면 정중앙 정렬을 위한 Flexbox 설정 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* 둥근 글씨체 우선 적용 */
            font-family: 'M PLUS Rounded 1c', 'Pretendard', sans-serif;
            position: relative;
            overflow: hidden; /* 장식용 일러스트가 화면 밖으로 나갈 때 스크롤바 방지 */
        }

        /* 메인 콘텐츠 영역 (글씨와 버튼이 이미지 위에 오도록 설정) */
        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 중앙 안내 문구 스타일 */
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            /* 흰색 글씨 */
            color: #FFFFFF; 
            margin-bottom: 40px;
            /* 그라데이션 배경에서도 글씨가 또렷하게 보이도록 부드러운 그림자 추가 */
            text-shadow: 0px 4px 12px rgba(0, 0, 0, 0.12); 
            letter-spacing: -1px;
        }

        /* 버튼들을 나란히 배치하기 위한 컨테이너 */
        .button-container {
            display: flex;
            gap: 20px; /* 버튼 사이의 간격 */
        }

        /* 공통 버튼 스타일 */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            /* 연두색 배경 */
            background-color: #A3E635; 
            /* 흰색 글씨 */
            color: #FFFFFF; 
            text-decoration: none;
            border-radius: 30px; /* 둥근 버튼 모양 */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        /* 버튼 위에 마우스를 올렸을 때(Hover) 효과 */
        .btn:hover {
            background-color: #8BDE1E; /* 조금 더 진한 연두색으로 변동 */
            transform: translateY(-2px); /* 살짝 위로 떠오르는 효과 */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        /* 버튼을 클릭했을 때 효과 */
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
        }

        /* 일러스트 배치 스타일 (포지션 설정) */
        .decor-svg {
            position: absolute;
            pointer-events: none; /* 버튼 클릭 방해 방지 */
            filter: drop-shadow(0px 8px 20px rgba(0, 0, 0, 0.05));
        }

        /* 왼쪽 아래 아늑한 베개와 이불 침구 세트 */
        .svg-bedding {
            left: 5%;
            bottom: 8%;
            width: 280px;
            height: 280px;
        }

        /* 오른쪽 아래 귀여운 인형 두 마리 */
        .svg-dolls {
            right: 8%;
            bottom: 8%;
            width: 240px;
            height: 240px;
        }
    </style>
</head>
<body>

    <!-- 왼쪽 하단: 침대 베개와 이불 SVG 일러스트 -->
    <svg class="decor-svg svg-bedding" viewBox="0 0 200 200" xmlns="http://w3.org">
        <rect x="10" y="70" width="180" height="120" rx="30" fill="#FFFBF7"/>
        <rect x="20" y="80" width="160" height="100" rx="20" fill="#F4EAE1"/>
        <rect x="35" y="45" width="60" height="40" rx="15" fill="#FFD6E0"/>
        <rect x="105" y="45" width="60" height="40" rx="15" fill="#FFFFFF"/>
        <path d="M 10 110 Q 100 100 190 110 L 190 190 L 10 190 Z" fill="#E8F1F5" rx="10"/>
        <path d="M 10 110 Q 100 100 190 110 L 190 135 Q 100 125 10 135 Z" fill="#D4E4ED"/>
    </svg>
    
    <!-- 오른쪽 하단: 귀여운 곰인형과 토끼인형 SVG 일러스트 -->
    <svg class="decor-svg svg-dolls" viewBox="0 0 200 200" xmlns="http://w3.org">
        <g transform="translate(40, 50)">
            <circle cx="20" cy="20" r="14" fill="#D7C4B7" />
            <circle cx="20" cy="20" r="7" fill="#ECCFC3" />
            <circle cx="80" cy="20" r="14" fill="#D7C4B7" />
            <circle cx="80" cy="20" r="7" fill="#ECCFC3" />
            <circle cx="50" cy="75" r="45" fill="#E6D5C3" />
            <circle cx="50" cy="50" r="35" fill="#D7C4B7" />
            <circle cx="50" cy="56" r="12" fill="#FFFFFF" />
            <ellipse cx="50" cy="50" rx="5" ry="3" fill="#4A3E3D" />
            <circle cx="38" cy="45" r="3.5" fill="#4A3E3D" />
            <circle cx="62" cy="45" r="3.5" fill="#4A3E3D" />
            <circle cx="28" cy="54" r="5" fill="#FFB3C6" opacity="0.6"/>
            <circle cx="72" cy="54" r="5" fill="#FFB3C6" opacity="0.6"/>
        </g>
        <g transform="translate(110, 80)">
            <ellipse cx="25" cy="20" rx="9" ry="25" fill="#F0E6EF" transform="rotate(-10 25 20)" />
            <ellipse cx="25" cy="20" rx="4" ry="17" fill="#FBC4D6" transform="rotate(-10 25 20)" />
            <ellipse cx="55" cy="20" rx="9" ry="25" fill="#F0E6EF" transform="rotate(10 55 20)" />
            <ellipse cx="55" cy="20" rx="4" ry="17" fill="#FBC4D6" transform="rotate(10 55 20)" />
            <circle cx="40" cy="80" r="30" fill="#F7EEF6" />
            <circle cx="40" cy="55" r="24" fill="#F0E6EF" />
            <circle cx="31" cy="52" r="2.5" fill="#4A3E3D" />
            <circle cx="49" cy="52" r="2.5" fill="#4A3E3D" />
            <polygon points="40,57 37,60 43,60" fill="#FBC4D6" />
            <circle cx="25" cy="58" r="4" fill="#FFB3C6" opacity="0.7"/>
            <circle cx="55" cy="58" r="4" fill="#FFB3C6" opacity="0.7"/>
        </g>
    </svg>

    <!-- 메인 콘텐츠 영역 -->
    <div class="main-content">
        <!-- 중앙 타이틀 문구 -->
        <div class="title">하나를 고르세요.</div>

        <!-- 나란히 배치된 버튼 2개 -->
        <div class="button-container">
            <!-- [변경] href 경로를 game.html로 수정했습니다 -->
            <a href="game.html" class="btn">자러가기</a>
            <a href="earth.html" class="btn">지진모델링</a>
        </div>
    </div>

</body>
</html>
